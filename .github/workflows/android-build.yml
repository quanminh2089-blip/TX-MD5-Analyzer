name: Build OniRoai APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Download Godot 4.5.1 and Android templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.5.1-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          unzip -q Godot_v4.5.1-stable_export_templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
      - name: Import assets
        run: ./Godot_v4.5.1-stable_linux.x86_64 --headless --editor --path . --import --quit
      - name: Export debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          mkdir -p output
          ./Godot_v4.5.1-stable_linux.x86_64 --headless --path . --export-debug Android output/OniRoai-v1.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OniRoai-v1.2-APK
          path: output/*.apk
          if-no-files-found: error
