
<!DOCTYPE html>
<html lang="vi" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="format-detection" content="telephone=no, email=no, address=no">
<title>Goalkeeper Ready</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#050608;font-family:'Segoe UI',Roboto,Arial,sans-serif}
  #loading-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#123a20 0%,#08140c 55%,#020402 100%);background-size:180% 180%;animation:bgDrift 9s ease-in-out infinite;z-index:50;overflow:hidden;transition:opacity .6s cubic-bezier(.4,0,.2,1)}
  #loading-screen.hide{opacity:0;pointer-events:none;transform:scale(1.03)}
  @keyframes bgDrift{0%,100%{background-position:50% 40%}50%{background-position:52% 60%}}
  #loading-screen::before{content:"";position:absolute;inset:-20%;background:conic-gradient(from 0deg at 50% 30%,transparent 0deg,rgba(255,255,255,.05) 8deg,transparent 20deg,transparent 360deg);animation:sweep 6s linear infinite;pointer-events:none}
  @keyframes sweep{to{transform:rotate(360deg)}}
  .particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .particle{position:absolute;bottom:-10px;border-radius:50%;background:rgba(143,242,156,.55);box-shadow:0 0 6px rgba(143,242,156,.6);animation-name:floatUp;animation-timing-function:ease-in;animation-iteration-count:infinite}
  @keyframes floatUp{0%{transform:translateY(0);opacity:0}10%{opacity:.9}90%{opacity:.4}100%{transform:translateY(-115vh) translateX(var(--drift,12px));opacity:0}}
  .logo-wrap{position:relative;display:flex;flex-direction:column;align-items:center;margin-bottom:46px;z-index:2}
  .ball-halo{position:absolute;top:50%;left:50%;width:110px;height:110px;transform:translate(-50%,-52%);border-radius:50%;background:radial-gradient(circle,rgba(61,220,107,.35) 0%,rgba(61,220,107,0) 70%);animation:haloPulse 1.4s ease-in-out infinite;z-index:0}
  @keyframes haloPulse{0%,100%{transform:translate(-50%,-52%) scale(.85);opacity:.6}50%{transform:translate(-50%,-52%) scale(1.15);opacity:1}}
  .ball{position:relative;z-index:1;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0 18%,transparent 19%),radial-gradient(circle at 68% 28%,#fff 0 18%,transparent 19%),radial-gradient(circle at 50% 62%,#fff 0 20%,transparent 21%),#1a1a1a;box-shadow:0 0 26px rgba(143,242,156,.35),inset -6px -6px 10px rgba(0,0,0,.5),inset 4px 4px 8px rgba(255,255,255,.25);background-color:#e9e9e9;animation:spin 1.4s linear infinite,bounce 1.1s ease-in-out infinite}
  .ball::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 20%,transparent 30%,rgba(0,0,0,.55) 31%,transparent 33%),radial-gradient(circle at 22% 55%,transparent 30%,rgba(0,0,0,.55) 31%,transparent 33%),radial-gradient(circle at 78% 55%,transparent 30%,rgba(0,0,0,.55) 31%,transparent 33%)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  .ball-shadow{width:46px;height:9px;margin-top:8px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.55) 0%,transparent 72%);animation:shadowPulse 1.1s ease-in-out infinite;z-index:1}
  @keyframes shadowPulse{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(.6);opacity:.25}}
  .game-title{margin-top:22px;color:#f5f5f5;font-size:24px;font-weight:800;letter-spacing:4px;text-transform:uppercase;z-index:2;text-shadow:0 0 12px rgba(143,242,156,.35);animation:titleGlow 2.2s ease-in-out infinite}
  @keyframes titleGlow{0%,100%{text-shadow:0 0 10px rgba(143,242,156,.25)}50%{text-shadow:0 0 22px rgba(143,242,156,.6)}}
  .bar-track{position:relative;width:230px;height:9px;margin-top:36px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.6);z-index:2}
  .bar-fill{position:relative;height:100%;width:0%;border-radius:6px;background:linear-gradient(90deg,#2fb85a,#8ef29c,#3ddc6b);background-size:220% 100%;animation:barGradient 1.4s linear infinite;transition:width .18s cubic-bezier(.3,.6,.3,1);box-shadow:0 0 10px rgba(143,242,156,.55)}
  @keyframes barGradient{0%{background-position:0% 0}100%{background-position:-220% 0}}
  .bar-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 48%,transparent 66%);background-size:200% 100%;animation:shimmer 1.1s linear infinite}
  @keyframes shimmer{0%{background-position:150% 0}100%{background-position:-50% 0}}
  .pct{margin-top:12px;color:#bdbdbd;font-size:12px;letter-spacing:1px;z-index:2}
  .pct.ready{color:#8ef29c;font-weight:700;letter-spacing:2px}
  #game-screen{position:absolute;inset:0;display:none;background:#000;opacity:0;transform:scale(1.04);transition:opacity .6s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.2,.8,.2,1)}
  #game-screen.show{opacity:1;transform:scale(1)}
  #gameCanvas{display:block;width:100%;height:100%}
  #rotate-warning{display:none;position:absolute;inset:0;z-index:100;background:#050608;flex-direction:column;align-items:center;justify-content:center;color:#eaeaea;text-align:center;padding:24px}
  .rotate-icon{font-size:44px;margin-bottom:14px;animation:rotateHint 1.6s ease-in-out infinite}
  @keyframes rotateHint{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
  @media(orientation:landscape){ #rotate-warning.active{display:flex}}
  #shot-controls{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 30px + 18vh);transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center;gap:-6px;z-index:20;padding:0;background:none;border:none;box-shadow:none;opacity:0;pointer-events:none;transition:opacity .25s ease}
  #shot-controls.reveal,#shot-controls.exiting{opacity:1}
  .shot-btn{-webkit-tap-highlight-color:transparent;touch-action:manipulation;position:relative;width:78px;height:132px;margin:0 -10px;border:none;background:transparent;padding:0;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;opacity:0;pointer-events:none;transform:translateY(14px) scale(.4);transition:filter .3s ease}
  .shot-btn svg{width:100%;height:100%;display:block;position:relative;z-index:1;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5));transition:transform .16s cubic-bezier(.34,1.56,.64,1),filter .3s ease}
  #shot-controls.reveal .shot-btn{pointer-events:auto;animation:btnPop .55s cubic-bezier(.34,1.56,.64,1) forwards}
  #shot-controls.reveal .shot-btn:nth-child(1){animation-delay:.06s}
  #shot-controls.reveal .shot-btn:nth-child(2){animation-delay:.16s}
  #shot-controls.reveal .shot-btn:nth-child(3){animation-delay:.26s}
  @keyframes btnPop{0%{opacity:0;transform:translateY(20px) scale(.4)}60%{opacity:1;transform:translateY(-6px) scale(1.08)}100%{opacity:1;transform:translateY(0) scale(1)}}
  #shot-controls.exiting .shot-btn{pointer-events:none;animation:btnHide .3s cubic-bezier(.4,0,.6,1) forwards}
  #shot-controls.exiting .shot-btn:nth-child(1){animation-delay:.06s}
  #shot-controls.exiting .shot-btn:nth-child(2){animation-delay:0s}
  #shot-controls.exiting .shot-btn:nth-child(3){animation-delay:.06s}
  @keyframes btnHide{to{opacity:0;transform:translateY(14px) scale(.5)}}
  .shot-btn.pressed svg{transform:translateY(6px) scale(.92)}
  .shot-btn.center{width:82px;height:140px}
  .shot-btn:active:not(.disabled) svg,.shot-btn.pressed svg{filter:brightness(1.2) drop-shadow(0 4px 8px rgba(0,0,0,.55))}
  .shot-btn.disabled{pointer-events:none}
  .shot-btn.disabled svg{filter:grayscale(1) brightness(.55) drop-shadow(0 4px 6px rgba(0,0,0,.35))}
  .shot-btn.reenable svg{animation:arrowPulse .5s ease-out}
  @keyframes arrowPulse{0%{filter:brightness(1.5) drop-shadow(0 0 14px rgba(255,205,60,.9))}100%{filter:brightness(1) drop-shadow(0 8px 12px rgba(0,0,0,.5))}}
  .spark{position:absolute;z-index:22;border-radius:50%;pointer-events:none;will-change:transform,opacity}
  #cashout-bar{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px + 26px);transform:translateX(-50%);width:min(84vw,340px);z-index:19;opacity:0;pointer-events:none}
  #cashout-bar.reveal,#cashout-bar.exiting{opacity:1}
  #cashout-bar .co-glow{position:absolute;left:50%;top:50%;width:150%;height:260%;transform:translate(-50%,-50%) scale(.3);border-radius:50%;background:radial-gradient(circle,rgba(120,255,150,.55) 0%,rgba(120,255,150,0) 68%);opacity:0;pointer-events:none;z-index:0}
  #cashout-bar.reveal .co-glow{animation:coGlowBurst .8s cubic-bezier(.16,.84,.32,1) forwards}
  @keyframes coGlowBurst{0%{opacity:.75;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.75)}}
  .cashout-btn{-webkit-tap-highlight-color:transparent;touch-action:manipulation;position:relative;width:100%;height:58px;border:2px solid rgba(255,255,255,.35);border-radius:14px;background:linear-gradient(180deg,#379c58 0%,#1f6636 48%,#0c331a 100%);box-shadow:0 12px 24px rgba(0,0,0,.5),inset 0 2px 3px rgba(255,255,255,.4),inset 0 -9px 13px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;overflow:visible;z-index:1;opacity:0;pointer-events:none;transform:scale(.3) translateY(30px);transform-origin:50% 100%;filter:none;transition:filter .25s ease}
  .cashout-btn::after{content:"";position:absolute;inset:-2px;border-radius:16px;border:3px solid rgba(160,255,180,.8);opacity:0;pointer-events:none;z-index:2}
  #cashout-bar.reveal .cashout-btn::after{animation:coRingBurst .7s cubic-bezier(.16,.84,.32,1) .06s forwards}
  @keyframes coRingBurst{0%{opacity:.8;transform:scale(.9)}100%{opacity:0;transform:scale(1.22)}}
  #cashout-bar.reveal .cashout-btn{pointer-events:auto;animation:coPop .68s cubic-bezier(.22,1.2,.36,1) forwards}
  @keyframes coPop{0%{opacity:0;transform:scale(.3) translateY(30px)}45%{opacity:1;transform:scale(1.08) translateY(-6px)}68%{transform:scale(.97) translateY(1px)}86%{transform:scale(1.02) translateY(0)}100%{opacity:1;transform:scale(1) translateY(0)}}
  #cashout-bar.exiting .cashout-btn{pointer-events:none;animation:coHide .28s cubic-bezier(.4,0,.6,1) forwards!important}
  @keyframes coHide{to{opacity:0;transform:scale(.4) translateY(16px)}}
  .cashout-shine{position:absolute;inset:0;border-radius:12px;overflow:hidden;z-index:0}
  .cashout-shine::before{content:"";position:absolute;inset:-30% -60%;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.4) 48%,transparent 66%);background-size:220% 100%;animation:coShine 2.3s linear infinite}
  @keyframes coShine{0%{background-position:150% 0}100%{background-position:-50% 0}}
  .cashout-label{position:relative;z-index:2;color:#fff;font-weight:900;font-size:17px;letter-spacing:2px;text-shadow:0 2px 3px rgba(0,0,0,.5);display:inline-block}
  #cashout-bar.reveal .cashout-label{animation:coLabelPop .4s cubic-bezier(.3,1.2,.4,1) .18s backwards}
  @keyframes coLabelPop{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:translateY(0)}}
  .cashout-amount{position:relative;z-index:2;color:#eaffee;font-weight:800;font-size:13.5px;letter-spacing:.2px;padding:3px 10px;border-radius:9px;background:rgba(0,0,0,.28);box-shadow:inset 0 1px 2px rgba(0,0,0,.4);font-variant-numeric:tabular-nums;transition:color .2s ease;display:inline-block}
  #cashout-bar.reveal .cashout-amount{animation:coLabelPop .4s cubic-bezier(.3,1.2,.4,1) .26s backwards}
  .cashout-amount.co-rolling{animation:coAmountRoll .5s cubic-bezier(.34,1.56,.64,1)}
  @keyframes coAmountRoll{0%{transform:scale(1)}30%{transform:scale(1.3);color:#fff}100%{transform:scale(1)}}
  .cashout-btn.disabled{filter:grayscale(.75) brightness(.6);cursor:default}
  .cashout-btn.disabled .cashout-shine::before{animation:none;opacity:0}
  .cashout-btn.unlocked{animation:coUnlock .55s ease-out}
  @keyframes coUnlock{0%{filter:brightness(1.7) drop-shadow(0 0 18px rgba(143,242,156,.95))}100%{filter:brightness(1)}}
  .cashout-coins{position:absolute;bottom:-10px;width:36px;height:24px;pointer-events:none;z-index:3;opacity:0;transform:translateY(-18px) scale(.4) rotate(-30deg)}
  #cashout-bar.reveal .cashout-coins-left{animation:coCoinDrop .5s cubic-bezier(.34,1.56,.64,1) .2s forwards}
  #cashout-bar.reveal .cashout-coins-right{animation:coCoinDrop .5s cubic-bezier(.34,1.56,.64,1) .3s forwards}
  @keyframes coCoinDrop{0%{opacity:0;transform:translateY(-18px) scale(.4) rotate(-30deg)}70%{opacity:1;transform:translateY(2px) scale(1.12) rotate(6deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
  .cashout-coins-left{left:-9px}
  .cashout-coins-right{right:-9px}
  .cashout-coins i{position:absolute;display:block;width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 34% 26%,#ffe66d,#c99a00 72%);box-shadow:0 1px 2px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.6),inset 0 -2px 2px rgba(120,80,0,.5);border:.8px solid rgba(255,255,255,.3)}
  .cashout-coins-left i:nth-child(1){left:15px;bottom:0;z-index:3}
  .cashout-coins-left i:nth-child(2){left:7px;bottom:2px;z-index:2}
  .cashout-coins-left i:nth-child(3){left:0;bottom:3px;z-index:1}
  .cashout-coins-right i:nth-child(1){right:15px;bottom:0;z-index:3}
  .cashout-coins-right i:nth-child(2){right:7px;bottom:2px;z-index:2}
  .cashout-coins-right i:nth-child(3){right:0;bottom:3px;z-index:1}
  #goal-notify{position:absolute;z-index:70;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;text-align:center}
  #goal-notify .gn-ring{display:none}
  #goal-notify .gn-burst{display:none}
  #goal-notify .gn-text{position:relative;z-index:2;display:inline-block;font-family:'Arial Black',Arial,sans-serif;font-weight:900;letter-spacing:3px;font-size:clamp(28px,8vw,46px);opacity:0;white-space:nowrap}
  #goal-notify .gn-text::before{display:none}
  #goal-notify.show.goal .gn-text{color:#ffb020;animation:gnFade 1s ease-out forwards}
  #goal-notify.show.miss .gn-text{color:#c21f14;animation:gnFade 1s ease-out forwards}
  @keyframes gnFade{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
  .gn-spark{position:absolute;z-index:69;border-radius:50%;pointer-events:none;will-change:transform,opacity}
  #bet-controls{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:14px;z-index:20}
  .bet-tri{-webkit-tap-highlight-color:transparent;touch-action:manipulation;position:relative;width:48px;height:88px;border:none;cursor:pointer;opacity:0;pointer-events:none;display:flex;transition:filter .2s ease}
  .bet-tri-left{clip-path:polygon(100% 4%,100% 96%,4% 50%)}
  .bet-tri-right{clip-path:polygon(0% 4%,0% 96%,96% 50%)}
  .bet-tri-left .bet-tri-face{position:absolute;inset:0;background:radial-gradient(circle at 75% 30%,#3a3a3a,#0a0a0a 78%);box-shadow:inset 0 1px 2px rgba(255,255,255,.18)}
  .bet-tri-right .bet-tri-face{position:absolute;inset:0;background:radial-gradient(circle at 25% 30%,#3a3a3a,#0a0a0a 78%);box-shadow:inset 0 1px 2px rgba(255,255,255,.18)}
  .bet-tri-inner{position:relative;z-index:1;color:#fff;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;width:100%;height:100%;text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .bet-tri-left .bet-tri-inner{justify-content:flex-end;padding-right:14px}
  .bet-tri-right .bet-tri-inner{justify-content:flex-start;padding-left:14px}
  .bet-tri:active:not(.disabled){filter:brightness(1.25)}
  .bet-square{position:relative;width:92px;height:92px;border-radius:20px;border:1.5px solid rgba(255,255,255,.3);background:linear-gradient(145deg,#3ddc6b,#1f8f43 60%,#136a30);box-shadow:0 10px 24px rgba(0,0,0,.5),0 0 26px rgba(61,220,107,.35),inset 0 2px 3px rgba(255,255,255,.45),inset 0 -6px 10px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;z-index:1;opacity:0;pointer-events:none;overflow:hidden;animation:squareBreathe 2.2s ease-in-out infinite;transition:filter .15s ease}
  @keyframes squareBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
  .bet-square::before{content:"";position:absolute;inset:-30% -30%;background:conic-gradient(rgba(255,255,255,0) 0%,rgba(255,255,255,.22) 8%,rgba(255,255,255,0) 18%);animation:squareSweep 2.6s linear infinite}
  @keyframes squareSweep{to{transform:rotate(360deg)}}
  .bet-play-text{position:relative;z-index:1;color:#fff;font-size:18px;font-weight:900;letter-spacing:2.5px;text-shadow:0 2px 3px rgba(0,0,0,.4)}
  .bet-amount{position:relative;z-index:1;color:#eaffee;font-size:13px;font-weight:700;letter-spacing:.5px;padding:2px 10px;border-radius:10px;background:rgba(0,0,0,.22);box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
  .bet-square:active:not(.disabled){filter:brightness(1.1)}
  .bet-square.bump{animation:squareBreathe 2.2s ease-in-out infinite,betBump .32s ease}
  @keyframes betBump{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}
  .bet-square.shake{animation:betShake .45s ease}
  @keyframes betShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px) rotate(-2deg)}40%{transform:translateX(8px) rotate(2deg)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
  .bet-square.disabled{filter:grayscale(.6) brightness(.6);animation:none}
  #bet-controls.reveal .bet-tri,#bet-controls.reveal .bet-square{pointer-events:auto;animation-name:betPop;animation-duration:.55s;animation-timing-function:cubic-bezier(.34,1.56,.64,1);animation-fill-mode:forwards}
  #bet-controls.reveal .bet-square{animation-name:betPopSquare,squareBreathe;animation-duration:.55s,2.2s;animation-timing-function:cubic-bezier(.34,1.56,.64,1),ease-in-out;animation-fill-mode:forwards,none;animation-delay:.1s,.65s;animation-iteration-count:1,infinite}
  #bet-controls.reveal .bet-tri-left{animation-delay:0s}
  #bet-controls.reveal .bet-tri-right{animation-delay:.16s}
  @keyframes betPop{0%{opacity:0;transform:scale(.3)}60%{opacity:1}100%{opacity:1;transform:scale(1)}}
  @keyframes betPopSquare{0%{opacity:0;transform:scale(.2) rotate(-25deg)}55%{opacity:1;transform:scale(1.12) rotate(4deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
  #bet-controls.exiting .bet-tri,#bet-controls.exiting .bet-square{pointer-events:none;animation:betHide .28s cubic-bezier(.4,0,.6,1) forwards!important}
  #bet-controls.exiting .bet-square{animation-delay:.06s!important}
  @keyframes betHide{to{opacity:0;transform:scale(.4)}}
  #balance-display{position:absolute;left:calc(env(safe-area-inset-left,0px) + 16px);top:calc(env(safe-area-inset-top,0px) + 54px);z-index:20;display:flex;align-items:center;gap:8px;padding:7px 14px 7px 7px;border-radius:22px;background:rgba(16,19,17,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);box-shadow:0 6px 16px rgba(0,0,0,.4);opacity:0;transform:translateY(-14px);transition:opacity .45s ease .1s,transform .5s cubic-bezier(.2,.8,.2,1) .1s}
  body.hud-show #balance-display{opacity:1;transform:translateY(0)}
  #balance-coin{width:23px;height:23px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(155deg,#ffe066,#d9a300);color:#4a3300;font-size:12.5px;font-weight:900;font-family:Arial,sans-serif;box-shadow:0 1px 3px rgba(0,0,0,.35),inset 0 1px 1px rgba(255,255,255,.5)}
  #balance-amount{position:relative;display:inline-block;color:#f5f5f5;font-size:16px;font-weight:800;letter-spacing:.2px;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.5);transition:color .3s ease}
  #balance-amount .cents{opacity:.6;font-size:12px;font-weight:700}
  #balance-amount.flash-gain{color:#8ef29c}
  #balance-amount.flash-loss{color:#ff8577}
  #balance-display.bump{animation:balanceBump .4s cubic-bezier(.3,1.4,.4,1)}
  @keyframes balanceBump{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
  #balance-display.deny{animation:balanceDeny .4s ease}
  @keyframes balanceDeny{0%,100%{transform:scale(1)}25%{transform:scale(.96) translateX(-3px)}50%{transform:scale(.96) translateX(3px)}75%{transform:scale(.98) translateX(-2px)}}
  .balance-float{position:absolute;left:50%;top:-2px;font-size:13px;font-weight:800;letter-spacing:.2px;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums;animation:balanceFloatUp .9s cubic-bezier(.2,.7,.3,1) forwards}
  .balance-float.gain{color:#8ef29c;text-shadow:0 2px 5px rgba(0,0,0,.55),0 0 10px rgba(143,242,156,.6)}
  .balance-float.loss{color:#ff8577;text-shadow:0 2px 5px rgba(0,0,0,.55),0 0 10px rgba(255,110,90,.5)}

  .tier-btn{-webkit-tap-highlight-color:transparent;touch-action:manipulation;position:relative;height:31px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-size:9.5px;font-weight:900;letter-spacing:.8px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55);cursor:pointer;border:2.2px solid;opacity:0;pointer-events:none;transform:translateX(-22px) scale(.82);transition:filter .35s ease,transform .22s cubic-bezier(.22,.61,.36,1);box-shadow:0 5px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2);overflow:visible}
  .tier-btn::after{content:"";position:absolute;inset:-5px;border-radius:12px;box-shadow:0 0 0 rgba(0,0,0,0);opacity:0;pointer-events:none;transition:opacity .25s ease}
  #tier-select.reveal .tier-amateur{animation-name:tierPop;animation-duration:.5s;animation-timing-function:cubic-bezier(.34,1.56,.64,1);animation-fill-mode:forwards;animation-delay:.08s}
  #tier-select.reveal .tier-club{animation-name:tierPop;animation-duration:.5s;animation-timing-function:cubic-bezier(.34,1.56,.64,1);animation-fill-mode:forwards;animation-delay:.2s}
  #tier-select.reveal .tier-premier{animation-name:tierPop;animation-duration:.5s;animation-timing-function:cubic-bezier(.34,1.56,.64,1);animation-fill-mode:forwards;animation-delay:.32s}

  @keyframes tierPop{0%{opacity:0;transform:translateX(-22px) scale(.82)}60%{opacity:1;transform:translateX(3px) scale(1.05)}100%{opacity:1;transform:translateX(0) scale(1)}}
  .tier-amateur{--glow:rgba(61,220,107,.9);width:68px;align-self:flex-start;border-color:#3ddc6b;background:linear-gradient(160deg,#1a4d28,#0a1f10 75%)}
  .tier-club{--glow:rgba(255,176,32,.9);width:84px;align-self:flex-start;margin-left:8px;border-color:#ffb020;background:linear-gradient(160deg,#7a4a06,#2c1c02 75%)}
  .tier-premier{--glow:rgba(255,65,54,.9);width:94px;align-self:flex-start;margin-left:15px;border-color:#ff4136;background:linear-gradient(160deg,#6e1210,#220505 75%)}
  .tier-btn.selected{filter:brightness(1.1)}
  .tier-btn.selected::after{opacity:1;box-shadow:0 0 14px var(--glow);animation:tierGlowPulse 1.4s ease-in-out infinite}
  @keyframes tierGlowPulse{0%,100%{opacity:.65}50%{opacity:1}}

  .tier-coins i{position:absolute;display:block;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 34% 26%,#ffe66d,#c99a00 72%);box-shadow:0 1px 2px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.6),inset 0 -2px 2px rgba(120,80,0,.5);border:.7px solid rgba(255,255,255,.3)}

  /* ================= AUTH SCREEN ================= */
  #auth-screen{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 20%,#134026 0%,#081a10 48%,#020402 100%);background-size:180% 180%;animation:bgDrift 10s ease-in-out infinite;transition:opacity .55s cubic-bezier(.4,0,.2,1),transform .55s cubic-bezier(.4,0,.2,1);padding:24px}

  .auth-orb{position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none;background:radial-gradient(circle,rgba(143,242,156,.35) 0%,rgba(143,242,156,0) 70%);animation:orbFloat 7s ease-in-out infinite}

var jpLadderEl=document.getElementById('jackpot-ladder');
var winStreak=0; // số lượt thắng liên tiếp hiện tại
var winMultiplier=1.7; // hệ số nhân của hạng đang chọn (AMATEUR/CLUB/PREMIER)
function jpFormat(v){return (v>=100?Math.round(v):(Math.round(v*100)/100))+' Token'}
var jpCurrentValues=[0,0,0,0,0,0,0,0,0]; // giá trị đang hiển thị của mỗi bậc (index 0 = bậc 1)
var jpInitialized=false;
function jpAnimateRow(el,lvl,fromV,toV){
  var dur=520,start=performance.now();
  el.classList.remove('jp-rolling');void el.offsetWidth;el.classList.add('jp-rolling');
  function step(now){
    var t=Math.min((now-start)/dur,1);
    var ease=1-Math.pow(1-t,3);
    var val=fromV+(toV-fromV)*ease;
    el.textContent=jpFormat(val);
    if(t<1){requestAnimationFrame(step)}else{
      el.textContent=jpFormat(toV);
      jpCurrentValues[lvl-1]=toV;
      el.classList.remove('jp-rolling');
    }
  }
  requestAnimationFrame(step);
}
function updateJackpotValues(){
  for(var lvl=1;lvl<=9;lvl++){
    var amount=betAmount*winMultiplier*Math.pow(2,lvl-1);
    var el=document.getElementById('jpVal'+lvl);
    if(!el)continue;
    if(!jpInitialized){
      el.textContent=jpFormat(amount);
      jpCurrentValues[lvl-1]=amount;
      continue;
    }
    var fromV=jpCurrentValues[lvl-1];
    if(Math.abs(fromV-amount)<0.005)continue;
    jpAnimateRow(el,lvl,fromV,amount);
  }
  jpInitialized=true;
}
function setJackpotHighlight(level){
  for(var lvl=1;lvl<=9;lvl++){
    var row=document.getElementById('jpRow'+lvl);
    var num=document.getElementById('jpNum'+lvl);
    var val=document.getElementById('jpVal'+lvl);
    if(!row)continue;
    if(lvl===level){
      row.setAttribute('fill','url(#jpGold)');
      if(num){num.setAttribute('fill','#ffffff');num.setAttribute('stroke','#5a2200')}
      if(val){val.setAttribute('fill','#ffffff');val.setAttribute('stroke','#5a2200')}
    }else{
      row.setAttribute('fill','url(#jpNavy)');
      if(num){num.setAttribute('fill','#f4f4f4');num.setAttribute('stroke','#0a1a30')}
      if(val){val.setAttribute('fill','#f2c14e');val.setAttribute('stroke','#3a1c00')}

}

/* ===== ROUND PLAN: mỗi ván random gán 3 kết quả cho 3 hướng =====
   Luôn có đúng: 1 hướng VÀO LƯỚI (goal), 1 hướng bị THỦ MÔN BẮT (save), 1 hướng DỘI CỘT (post)
   ROUND_PERMS liệt kê đủ 6 hoán vị có thể có của (goal,save,post) cho (left,mid,right).
   Thứ tự trong mảng này phải khớp CHÍNH XÁC với PERMS trong tool.py để giải mã đúng. */
var roundPlan=null;
var ROUND_PERMS=[
  ['goal','save','post'],
  ['goal','post','save'],
  ['save','goal','post'],
  ['save','post','goal'],
  ['post','goal','save'],
  ['post','save','goal']
];
var currentPermIndex=0;
function planRound(){
  var dirs=['left','mid','right'];
  currentPermIndex=Math.floor(Math.random()*ROUND_PERMS.length);
  var outs=ROUND_PERMS[currentPermIndex];
  roundPlan={};
  dirs.forEach(function(d,i){roundPlan[d]=outs[i]});
  return currentPermIndex;
}

function easeOutQuart(t){return 1-Math.pow(1-t,4)}
function easeInCubic(t){return t*t*t}
function easeInOutCubic(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function easeOutBack(t){var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)}
function lerp(a,b,t){return a+(b-a)*t}

/* ===== GOALKEEPER ===== */
var GK={
  state:'idle',stateTime:0,stateDur:0,
  pose:'idle',prevPose:'idle',poseT:0,poseDur:200,
  screenX:0,screenY:0,
  targetScreenX:0,targetScreenY:0,
  diveDir:null,diveDist:0,diveArc:0,
  diveProgress:0,
  setPose:function(name,dur){this.prevPose=this.pose;this.pose=name;this.poseT=0;this.poseDur=dur||200},
  setState:function(state,dur){this.state=state;this.stateTime=0;this.stateDur=dur},
  anticipate:function(predictedDir){
    this.setState('anticipate',450);
    this.setPose('anticipate',250);
    this.targetScreenX=0;this.targetScreenY=0;
  },
  dive:function(dir,goalInfo){
    this.diveDir=dir;
    this.setState('dive',750);
    this.diveProgress=0;
    if(dir==='left'){
      this.diveDist=goalInfo.gw*0.30;
      this.diveArc=goalInfo.gh*0.22;
      this.setPose('diveLeft',300);
    }else if(dir==='right'){
      this.diveDist=goalInfo.gw*0.30;
      this.diveArc=goalInfo.gh*0.22;
      this.setPose('diveRight',300);
    }else{
      this.diveDist=0;
      this.diveArc=goalInfo.gh*0.15;
      this.setPose('diveCenter',300);
    }
  },
  hold:function(){this.setState('hold',1100);this.setPose('catch',200)},
  miss:function(){this.setState('dejected',1000);this.setPose('dejected',350)},
  recover:function(){
    this.recoverFromX=this.screenX;this.recoverFromY=this.screenY;
    this.setState('recover',650);this.setPose('idle',450);
    this.targetScreenX=0;this.targetScreenY=0;
  },
  update:function(dt){
    this.stateTime+=dt;
    this.poseT+=dt;
    if(this.state==='dive'){
      this.diveProgress=Math.min(this.stateTime/this.stateDur,1);
      var t=easeOutCubic(this.diveProgress);
      var dirSign=this.diveDir==='left'?-1:(this.diveDir==='right'?1:0);
      this.screenX=dirSign*this.diveDist*t;
      this.screenY=-this.diveArc*Math.sin(t*Math.PI);
    }else if(this.state==='recover'){
      var rt=Math.min(this.stateTime/this.stateDur,1);
      var re=easeOutBack(rt);
      this.screenX=lerp(this.recoverFromX,0,re);
      this.screenY=lerp(this.recoverFromY,0,re);
    }else if(this.state==='hold'||this.state==='dejected'){
    }else{
      this.screenX+=(this.targetScreenX-this.screenX)*Math.min(dt*0.006,1);
      this.screenY+=(this.targetScreenY-this.screenY)*Math.min(dt*0.006,1);
    }
    if(this.stateDur>0&&this.stateTime>=this.stateDur){
      if(this.state==='anticipate'){}
      else if(this.state==='dive'){
        if(BALL.outcome==='save')this.hold();
        else this.miss();
      }
      else if(this.state==='hold'||this.state==='dejected'){this.recover()}
      else if(this.state==='recover'){this.screenX=0;this.screenY=0;this.setState('idle',0);this.setPose('idle',100)}
    }
  },
  getPoseOffsets:function(){
    var t=Math.min(this.poseT/this.poseDur,1);
    var e=easeOutCubic(t);
    var prev=POSES[this.prevPose]||POSES.idle;
    var next=POSES[this.pose]||POSES.idle;
    return{
      bodyDx:lerp(prev.bodyDx,next.bodyDx,e),
      bodyDy:lerp(prev.bodyDy,next.bodyDy,e),
      armDx:lerp(prev.armDx,next.armDx,e),
      armDy:lerp(prev.armDy,next.armDy,e)
    };
  },
  draw:function(originX,originY,px,t){
    var blinkPhase=t%3600,blinking=blinkPhase<120;
    var off=this.getPoseOffsets();
    var rx=originX+this.screenX;
    var ry=originY+this.screenY;
    ctx.save();
    ctx.translate(rx,ry);
    ctx.scale(px,px);
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(GRID_W/2,GRID_H-0.5-(this.screenY/px),7.5,1.6,0,0,Math.PI*2);
    ctx.fill();
    var bdx=off.bodyDx,bdy=off.bodyDy;
    ctx.fillStyle=C.outline;
    BODY_IDX.forEach(function(i){var p=baseParts[i];ctx.fillRect(p.x+bdx-1,p.y+bdy-1,p.w+2,p.h+2)});
    BODY_IDX.forEach(function(i){var p=baseParts[i];ctx.fillStyle=p.c;ctx.fillRect(p.x+bdx,p.y+bdy,p.w,p.h)});
    BODY_DET_IDX.forEach(function(i){var p=detailParts[i];ctx.fillStyle=p.c;ctx.fillRect(p.x+bdx,p.y+bdy,p.w,p.h)});
    var adx=off.bodyDx+off.armDx,ady=off.bodyDy+off.armDy;
    ctx.fillStyle=C.outline;
    ARM_IDX.forEach(function(i){var p=baseParts[i];ctx.fillRect(p.x+adx-1,p.y+ady-1,p.w+2,p.h+2)});
    ARM_IDX.forEach(function(i){var p=baseParts[i];ctx.fillStyle=p.c;ctx.fillRect(p.x+adx,p.y+ady,p.w,p.h)});
    ARM_DET_IDX.forEach(function(i){var p=detailParts[i];ctx.fillStyle=p.c;ctx.fillRect(p.x+adx,p.y+ady,p.w,p.h)});
    EYE_IDX.forEach(function(i){var p=detailParts[i];ctx.fillStyle=blinking?C.skin:p.c;ctx.fillRect(p.x+bdx,p.y+bdy,p.w,p.h)});
    ctx.restore();
  },
  getGlovePos:function(originX,originY,px){
    var off=this.getPoseOffsets();
    var adx=off.bodyDx+off.armDx,ady=off.bodyDy+off.armDy;
    var gx=originX+this.screenX+(12+adx)*px;
    var gy=originY+this.screenY+(7+ady)*px;
    return{x:gx,y:gy};
  }
};

/* ===== BALL ===== */
var BALL_FLY_SAVE=700,BALL_FLY_GOAL=900,BALL_FLY_POST=520;
var BALL_BOUNCE_DUR=1150,BALL_POST_DUR=680,BALL_SETTLE_PAUSE=280,BALL_RETURN_DUR=850;
function easeOutElastic(t){var c4=(2*Math.PI)/3.2;return t===0?0:t===1?1:Math.pow(2,-8*t)*Math.sin((t*8-0.75)*c4)+1}
var BALL={
  state:'idle',time:0,
  startX:0,startY:0,targetX:0,targetY:0,
  catchX:0,catchY:0,
  postX:0,postY:0,
  deflectX:0,deflectY:0,
  bounceBaseX:0,bounceBaseY:0,rollX:0,
  returnFromX:0,returnFromY:0,
  direction:null,predictedDir:null,outcome:null,result:null,
  rotation:0,scale:1,trail:[],spinSpeed:0.012,
  reset:function(x,y){
    this.state='idle';this.startX=x;this.startY=y;
    this.rotation=0;this.scale=1;this.trail=[];
    this.outcome=null;this.result=null;this.direction=null;this.predictedDir=null;
  },
  startSpin:function(dir){
    this.state='spin';this.time=0;this.direction=dir;
    this.outcome=(roundPlan&&roundPlan[dir])||'goal';
    this.result=this.outcome==='save'?'saved':(this.outcome==='post'?'post':'goal');
    if(this.outcome==='save'){
      this.predictedDir=dir;
    }else{
      var o=['left','mid','right'].filter(function(d){return d!==dir});
      this.predictedDir=o[Math.floor(Math.random()*o.length)];
    }
  },
  update:function(dt,goalInfo){
    this.time+=dt;
    if(this.state==='spin'){
      var t=Math.min(this.time/400,1);
      this.rotation=t*Math.PI*2;
      this.scale=1+Math.sin(t*Math.PI)*0.12;
      if(t>=1){
        this.state='fly';this.time=0;
        if(this.outcome==='save'){
          this.targetX=goalInfo.targets[this.direction].x;
          this.targetY=goalInfo.targets[this.direction].y;
          var ce=easeOutQuart(0.62);
          this.catchX=lerp(this.startX,this.targetX,ce);
          this.catchY=lerp(this.startY,this.targetY,ce)+Math.sin(ce*Math.PI)*-55;
        }else if(this.outcome==='post'){
          var pp=goalInfo.postPoints[this.direction];
          this.postX=pp.x;this.postY=pp.y;
        }else{
          this.targetX=goalInfo.targets[this.direction].x;
          this.targetY=goalInfo.targets[this.direction].y;
        }
        GK.anticipate(this.predictedDir);
      }
    }
    else if(this.state==='fly'){
      var dur=this.outcome==='save'?BALL_FLY_SAVE:(this.outcome==='post'?BALL_FLY_POST:BALL_FLY_GOAL);
      var t2=Math.min(this.time/dur,1);
      var e=easeOutQuart(t2);
      this.scale=1-e*0.35;
      this.rotation+=dt*this.spinSpeed;
      var pos=this.getPos();
      if(pos&&Math.random()>0.4)this.trail.push({x:pos.x,y:pos.y,s:this.scale,life:1});
      for(var i=this.trail.length-1;i>=0;i--){this.trail[i].life-=dt*0.003;if(this.trail[i].life<=0)this.trail.splice(i,1)}
      if(t2>=0.15&&GK.state==='anticipate'){GK.dive(this.predictedDir,goalInfo)}
      if(t2>=1){
        if(this.outcome==='save'){
          this.state='held';this.time=0;
        }else if(this.outcome==='post'){
          this.state='postImpact';this.time=0;
          var dx=this.postX-goalInfo.gx-goalInfo.gw/2;
          var side=this.direction==='mid'?(Math.random()<0.5?-1:1):(dx<0?-1:1);
          if(this.direction==='mid'){
            this.deflectX=this.postX+side*goalInfo.gw*0.55;
            this.deflectY=this.postY-goalInfo.gh*0.85;
          }else{
            this.deflectX=this.postX+side*goalInfo.gw*0.62;
            this.deflectY=this.postY+goalInfo.gh*0.30;
          }
          this.spinSpeed=0.03;
          spawnPostFlash(this.postX,this.postY);
        }else{
          this.state='bounceGoal';this.time=0;
          this.bounceBaseX=this.targetX;this.bounceBaseY=this.targetY;
          this.rollX=this.targetX+(Math.random()*2-1)*goalInfo.gw*0.10;
          NET.triggerImpact(this.targetX,this.targetY);
        }
      }
    }
    else if(this.state==='held'){
      for(var i=this.trail.length-1;i>=0;i--){this.trail[i].life-=dt*0.006;if(this.trail[i].life<=0)this.trail.splice(i,1)}
      if(GK.state==='idle'){
        var gp=GK.getGlovePos(goalInfo.originX,goalInfo.originY,goalInfo.px);
        this.returnFromX=gp.x;this.returnFromY=gp.y;
        this.startReturn();
      }
    }
    else if(this.state==='bounceGoal'){
      var bt=Math.min(this.time/BALL_BOUNCE_DUR,1);
      this.rotation+=dt*0.018;
      if(pos_trailTick(this,dt,0.5))this.trail.push({x:this.getPos().x,y:this.getPos().y,s:this.scale,life:1});
      trimTrail(this,dt*0.0032);
      if(bt>=1){
        this.state='idle_pause';this.time=0;
        this.returnFromX=this.bounceGroundX;this.returnFromY=this.bounceGroundY;
      }
    }
    else if(this.state==='postImpact'){
      var pt=Math.min(this.time/BALL_POST_DUR,1);
      this.rotation+=dt*this.spinSpeed;
      this.scale=Math.max(0.15,this.scale-dt*0.0009);
      if(pos_trailTick(this,dt,0.35))this.trail.push({x:this.getPos().x,y:this.getPos().y,s:this.scale,life:1});
      trimTrail(this,dt*0.0035);
      if(pt>=1){
        this.state='idle_pause';this.time=0;
        this.returnFromX=this.deflectX;this.returnFromY=this.deflectY;
      }
    }
    else if(this.state==='idle_pause'){
      trimTrail(this,dt*0.004);
      if(this.time>=BALL_SETTLE_PAUSE)this.startReturn();
    }
    else if(this.state==='returning'){
      var rdur=BALL_RETURN_DUR,rt=Math.min(this.time/rdur,1);
      var re=easeInOutCubic(rt);
      this.rotation+=dt*0.01;
      this.scale=0.55+re*0.45;
      var rp=this.getPos();
      if(rp&&Math.random()>0.5)this.trail.push({x:rp.x,y:rp.y,s:this.scale,life:1});
      trimTrail(this,dt*0.003);
      if(rt>=1){this.state='idle';this.trail=[];this.rotation=0;this.scale=1}
    }
  },
  startReturn:function(){
    this.state='returning';this.time=0;
  },
  getPos:function(){
    if(this.state==='idle'||this.state==='spin')return{x:this.startX,y:this.startY};
    if(this.state==='fly'){
      if(this.outcome==='save'){
        var dur=BALL_FLY_SAVE,t=Math.min(this.time/dur,1),e=easeOutQuart(t);
        return{x:lerp(this.startX,this.catchX,e),y:lerp(this.startY,this.catchY,e)};
      }else if(this.outcome==='post'){
        var dur3=BALL_FLY_POST,t3=Math.min(this.time/dur3,1),e3=easeOutQuart(t3);
        var x3=lerp(this.startX,this.postX,e3),y3=lerp(this.startY,this.postY,e3)+Math.sin(e3*Math.PI)*-45;
        return{x:x3,y:y3};
      }else{
        var dur2=BALL_FLY_GOAL,t2=Math.min(this.time/dur2,1),e2=easeOutQuart(t2);

        var arc=Math.sin(e2*Math.PI)*-55;
        return{x:x2,y:by2+arc};
      }
    }
    if(this.state==='held')return null;
    if(this.state==='bounceGoal'){
      var bt=Math.min(this.time/BALL_BOUNCE_DUR,1);
      var floorY=this.bounceBaseY+90;
      var rollT=easeOutCubic(bt);
      var x=lerp(this.bounceBaseX,this.rollX,rollT);
      var bounces=3,amp0=60;
      var phase=bt*bounces;

      var amp=amp0*Math.pow(0.42,bounceIdx);
      var arcY=-Math.sin(localT*Math.PI)*amp;
      var fall=lerp(this.bounceBaseY,floorY,easeOutCubic(Math.min(bt*1.4,1)));
      var y=fall+arcY;
      this.bounceGroundX=x;this.bounceGroundY=floorY;
      this.scale=0.55+bt*0.55;
      return{x:x,y:y};
    }
    if(this.state==='postImpact'){
      var pt=Math.min(this.time/BALL_POST_DUR,1),pe=easeOutCubic(pt);
      var arc=-Math.sin(pt*Math.PI)*40;
      return{x:lerp(this.postX,this.deflectX,pe),y:lerp(this.postY,this.deflectY,pe)+arc};
    }
    if(this.state==='idle_pause'){
      if(this.outcome==='post')return{x:this.deflectX,y:this.deflectY};
      return{x:this.bounceGroundX,y:this.bounceGroundY};
    }
    if(this.state==='returning'){
      var rdur=BALL_RETURN_DUR,rt=Math.min(this.time/rdur,1),re=easeInOutCubic(rt);
      var rx=lerp(this.returnFromX,this.startX,re);
      var ry=lerp(this.returnFromY,this.startY,re);
      var rarc=Math.sin(re*Math.PI)*-70;
      return{x:rx,y:ry+rarc};
    }
    return{x:this.startX,y:this.startY};
  }
};
function pos_trailTick(ball,dt,chance){return Math.random()>(1-chance)}
function trimTrail(ball,decay){for(var i=ball.trail.length-1;i>=0;i--){ball.trail[i].life-=decay;if(ball.trail[i].life<=0)ball.trail.splice(i,1)}}
function spawnPostFlash(x,y){POST_FX.push({x:x,y:y,time:0})}

/* ===== NET PHYSICS ===== */
var NET={
  impacts:[],
  triggerImpact:function(x,y){this.impacts.push({x:x,y:y,time:0,str:1})},
  update:function(dt){for(var i=this.impacts.length-1;i>=0;i--){this.impacts[i].time+=dt;this.impacts[i].str*=0.988;if(this.impacts[i].str<0.01)this.impacts.splice(i,1)}},
  getOffset:function(x,y,t){
    var dx=0,dy=0;
    for(var i=0;i<this.impacts.length;i++){
      var imp=this.impacts[i];var ddx=x-imp.x,ddy=y-imp.y;
      var dist=Math.sqrt(ddx*ddx+ddy*ddy);
      var waveR=imp.time*0.35;var dw=Math.abs(dist-waveR);

    }
    dy+=Math.sin(t*0.001+x*0.02)*0.3;
    return{dx:dx,dy:dy};
  }
};

  ctx.fillStyle='rgba(255,255,255,0.035)';var sw=w/14;for(var i=0;i<14;i+=2)ctx.fillRect(i*sw,h*0.55,sw,h*0.45);

  var sTW=gw*1.35,sBW=gw*1.55,sBY=lineY+gh*0.55;ctx.beginPath();ctx.moveTo(cx-sTW/2,lineY);ctx.lineTo(cx-sBW/2,sBY);ctx.lineTo(cx+sBW/2,sBY);ctx.lineTo(cx+sTW/2,lineY);ctx.stroke();

    postPoints:{left:{x:gx+post*0.5,y:gy+gh*0.36},mid:{x:cx,y:gy+post*0.5},right:{x:gx+gw-post*0.5,y:gy+gh*0.36}}
  };
}
function drawBallTrail(){BALL.trail.forEach(function(pt){ctx.save();ctx.globalAlpha=pt.life*0.5;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(pt.x,pt.y,4*pt.life*pt.s,0,Math.PI*2);ctx.fill();ctx.globalAlpha=pt.life*0.2;ctx.fillStyle='#8ef29c';ctx.beginPath();ctx.arc(pt.x,pt.y,8*pt.life*pt.s,0,Math.PI*2);ctx.fill();ctx.restore()})}
function drawPostFX(dt){
  for(var i=POST_FX.length-1;i>=0;i--){
    var fx=POST_FX[i];fx.time+=dt;
    var t=Math.min(fx.time/380,1);
    if(t>=1){POST_FX.splice(i,1);continue}

    ctx.globalAlpha=1-t;
    var r=6+t*34;

/* ===== MAIN DRAW ===== */
var lastGoalInfo=null;
function drawScene(t,dt){
  t=t||0;dt=dt||16;
  var w=window.innerWidth,h=window.innerHeight;
  ctx.clearRect(0,0,w,h);
  var goal=drawBackground(w,h,t);lastGoalInfo=goal;
  if(BALL.state==='idle'){BALL.startX=goal.spotX;BALL.startY=goal.spotY;BALL.targetX=goal.spotX;BALL.targetY=goal.spotY}
  var targetH=goal.gh*0.58,px=targetH/GRID_H,spriteW=GRID_W*px,spriteH=GRID_H*px;
  var originX=(w-spriteW)/2,originY=goal.lineY-spriteH;
  goal.originX=originX;goal.originY=originY;goal.px=px;
  ctx.imageSmoothingEnabled=false;
  GK.update(dt);
  BALL.update(dt,goal);
  NET.update(dt);
  GK.draw(originX,originY,px,t);
  drawBallTrail();
  drawPostFX(dt);
  var br=goal.ballR*BALL.scale;
  if(BALL.state==='held'){
    var glovePos=GK.getGlovePos(originX,originY,px);
    drawFootball(glovePos.x,glovePos.y,br,BALL.rotation);
  }else{
    var pos=BALL.getPos();
    if(pos)drawFootball(pos.x,pos.y,br,BALL.rotation);
  }
}
var lastTime=performance.now();
function loop(now){if(gameActive){var dt=Math.min(now-lastTime,50);lastTime=now;drawScene(now,dt)}requestAnimationFrame(loop)}

/* ===== CONTROLS ===== */
var shotBtns=Array.prototype.slice.call(document.querySelectorAll('.shot-btn'));
var isShooting=false;
function spawnSparks(btn,dir){var r=btn.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,color=dir==='mid'?'#f6cf00':'#8ef29c',ba=dir==='left'?180:(dir==='right'?0:-90);for(var i=0;i<9;i++){var el=document.createElement('div');el.className='spark';var s=3+Math.random()*3;el.style.width=s+'px';el.style.height=s+'px';el.style.left=(cx-s/2)+'px';el.style.top=(cy-s/2)+'px';el.style.background=color;el.style.boxShadow='0 0 8px '+color;document.body.appendChild(el);var a=(ba+(Math.random()*70-35))*Math.PI/180,d=50+Math.random()*40,tx=Math.cos(a)*d,ty=Math.sin(a)*d;var anim=el.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+tx+'px,'+ty+'px) scale(.15)',opacity:0}],{duration:550+Math.random()*200,easing:'cubic-bezier(.2,.7,.3,1)'});anim.onfinish=(function(n){return function(){n.remove()}})(el)}}
function disableButtons(){shotBtns.forEach(function(b){b.classList.add('disabled');b.classList.remove('reenable')})}
function enableButtons(){shotBtns.forEach(function(b){b.classList.remove('disabled');b.classList.add('reenable');setTimeout(function(){b.classList.remove('reenable')},500)})}
function fireShot(btn){
  if(isShooting||!inSession||btn.classList.contains('disabled'))return;isShooting=true;
  var dir=btn.getAttribute('data-dir');
  var stake=betAmount;
  disableButtons();btn.classList.add('pressed');lockCashout();
  if(navigator.vibrate){try{navigator.vibrate(18)}catch(e){}}
  BALL.startSpin(dir);
  var outcome=BALL.outcome;
  var flyDur=outcome==='save'?BALL_FLY_SAVE:(outcome==='post'?BALL_FLY_POST:BALL_FLY_GOAL);
  var notifyDelay=400+flyDur;
  var tailDur;
  if(outcome==='save'){
    tailDur=1100+650+250+BALL_RETURN_DUR;
  }else{
    tailDur=(outcome==='post'?BALL_POST_DUR:BALL_BOUNCE_DUR)+BALL_SETTLE_PAUSE+BALL_RETURN_DUR+200;
  }
  var missedAll=false,wonRound=false;
  setTimeout(function(){
    if(outcome==='save'||outcome==='post'){
      if(navigator.vibrate){try{navigator.vibrate(outcome==='save'?[20,30,20]:[30,20,30,20,30])}catch(e){}}
      missedAll=true;
      jpRegisterResult(false);
      showGoalNotify('miss');
    }else{
      wonRound=true;
      if(navigator.vibrate){try{navigator.vibrate([60,30,60])}catch(e){}}
      jpRegisterResult(true);
      showGoalNotify('goal');
    }
  },notifyDelay);

    if(lastGoalInfo)BALL.reset(lastGoalInfo.spotX,lastGoalInfo.spotY);
    GK.screenX=0;GK.screenY=0;GK.setState('idle',0);GK.setPose('idle',100);
    btn.classList.remove('pressed');isShooting=false;

      hideShotControls(function(){});
      hideCashoutBar(function(){showBetControls()});
          inSession=false;sessionStake=0;winStreak=0;setJackpotHighlight(1);
    }else if(wonRound&&winStreak>=9){
      var jackpot=sessionAmount(winStreak);
      inSession=false;
      addBalance(jackpot);
      hideShotControls(function(){});
      hideCashoutBar(function(){showBetControls()});
          winStreak=0;setJackpotHighlight(1);sessionStake=0;
    }else{
      enableButtons();
      unlockCashout();
    }

}
shotBtns.forEach(function(btn){btn.addEventListener('click',function(e){e.stopPropagation();fireShot(btn)});btn.addEventListener('touchstart',function(e){e.stopPropagation()},{passive:true})});

})();
